server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

# 登录查询会读取旧密码摘要，禁止将账号查询结果写入调试日志。
logging:
  level:
    com.zhj.blog.Mapper.UserMapper: WARN

spring:
  profiles:
    default: dev

  redis:
    database: 0
    #redis 服务器地址
    host: localhost
    #redis 端口
    port: 6379
    #redis 密码 默认为空
    password:
    # 链接超时时间
    connect-timeout: 10s

