spring:
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${BLOG_DB_URL:jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf-8}
    username: ${BLOG_DB_USERNAME}
    password: ${BLOG_DB_PASSWORD}

logging:
  level:
    root: warn
    com.lrm: info
  file:
    path: log/blog-pro.log
server:
  port: 8081



