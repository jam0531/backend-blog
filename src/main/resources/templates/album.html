<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图册</title>
    <link href="../static/images/twelve.jpg" th:href="@{/images/twelve.jpg}" rel="icon" type="image/x-ico">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.2/dist/jquery.min.js"></script>
    <script src="../static/lib/semantic/semantic.min.js" th:src="@{/lib/semantic/semantic.min.js}"></script>
    <link rel="stylesheet" href="../static/lib/semantic/semantic.min.css" th:href="@{/lib/semantic/semantic.min.css}">
    <link rel="stylesheet" href="../static/css/album.css" th:href="@{/css/album.css}">
    <link rel="stylesheet" href="../static/css/public.css" th:href="@{/css/public.css}">
    <link rel="stylesheet" href="../static/css/header.css" th:href="@{/css/header.css}">
    <link href="../static/lib/magnific-popup/magnific-popup.css" th:href="@{/lib/magnific-popup/magnific-popup.css}" rel="stylesheet">
</head>
<body>
<!-- 移动端的侧边栏 -->
    <div th:replace="fragments :: mobile-sidebar" class="ui right sidebar vertical menu m-mobile-show" id="mobile-sidebar" style="width: 250px;">
    <div class="item" align="center">
        <img src="../static/images/twelve.jpg" alt="" class="ui bordered circular image" style="width: 120px;height: 120px;">
    </div>
    <div class="item attached">
        <div class="mobile_post_data">
            <div class="mobile_data_item is-center">
                <div class="mobile_data_link">
                    <a href="#">
                        <div class="headline">Articles</div>
                        <div class="length_num">10</div>
                    </a>
                </div>
            </div>

            <div class="mobile_data_item is-center">
                <div class="mobile_data_link">
                    <a href="#">
                        <div class="headline">Tags</div>
                        <div class="length_num">2</div>
                    </a>
                </div>
            </div>

            <div class="mobile_data_item is-center">
                <div class="mobile_data_link">
                    <a href="#">
                        <div class="headline">Categories</div>
                        <div class="length_num">6</div>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <a class="item site-icon" href="home.html">
        <span><i class="home icon"></i>首页</span>
    </a>
    <a class="item site-icon" href="archive.html">
        <span><i class="box icon"></i>归档</span>
    </a>
    <a class="item site-icon" href="types.html">
        <span><i class="tags icon"></i>分类</span>
    </a>
    <a class="item site-icon" href="message.html">
        <span><i class="comment icon"></i>留言</span>
    </a>
    <a class="item site-icon" href="friend-links.html">
        <span><i class="user plus icon"></i>友链</span>
    </a>
    <a href="about.html" class="item site-icon" >
        <span><i class="user icon"></i>关于 我</span>
    </a>
    <a href="aboutWeb.html" class="item site-icon" >
        <span><i class="laptop icon"></i>关于 网站</span>
    </a>
</div>

    <div class="site-wrapper">
        <div class="site" style="min-height: 0px;">
            <header class="site-header">
                <div class="album-site-logo">
                    <a th:href="@{/home}" >
                        <img th:src="@{https://cdn.jsdelivr.net/gh/jam0531/blogPic/202204072311645.png}" src="https://cdn.jsdelivr.net/gh/jam0531/blogPic/202204072311645.png" alt="">
                    </a>
                </div>
                <div class="site-name m-mobile-hide">
                    <a th:href="@{/album}">
                        <text>十二のアルバム</text>
                    </a>
                </div>
                <div class="site-time-list m-mobile-hide">
                    <div class="site-time-list-item" style="font-weight: bolder;color: gray">Time List</div>
                    <ul class="site-time-list-item" th:each="item : ${archivePic}">
                        <a th:href="@{/albumArchive/{date}(date=${item.key})}" href="#" th:text="${item.key}">2021-4-17</a>
                    </ul>
                </div>
                <a class="ui inverted icon button m-right-top m-mobile-show" id="menu-show">
                    <i class="sidebar icon"></i>
                </a>
            </header>
            <div class="site-main" style="min-height: 100vh">
                <div class="site-main-header" th:style="'background-image: url(' + ${bg.piclink} + ');'">
                    <div class="site-main-headline">十二のアルバム</div>
                    <div class="site-main-headline">これは私のお気に入りの壁紙です</div>
                </div>

                <div class="site-main-instrutor">
                    <text>wallhavenからダウンロード</text>
                    <text>侵害がある場合は、削除するために私に連絡してください</text>
                </div>

                <div class="site-main-photolist">
                    <div class="site-main-photo-item" th:each="pic : ${pictures}" th:href="@{${pic.piclink}}">
                        <a>
                            <img class="site-img lazyloaded"  th:attr="data-original=@{${pic.piclink}}" height="200" width="350" th:src="@{${pic.piclink}}" src="https://cdn.jsdelivr.net/gh/jam0531/blogPic/202204081907986.png">
                            <h2 class="entry-title" th:text="${pic.picDescription}">占着茅坑不拉屎</h2>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        $('#menu-show').click(function(){
            $('.ui.sidebar')
                .sidebar('setting', 'transition', 'overlay')
                .sidebar('toggle');
        })
    </script>
    <script src="../static/js/lazyload.js" th:src="@{/js/lazyload.js}"></script>
    <script>
        $('img.lazyloaded').lazyload({
            // placeholder:'../static/images/loading.gif'
            placeholder:'[[@{/images/loading.gif}]]'
        });
    </script>
    <script src="../static/lib/magnific-popup/magnific-popup.js" th:src="@{/lib/magnific-popup/magnific-popup.js}"></script>

    <script>
    $(function(){
        $('.site-main-photolist').magnificPopup({
            delegate: 'div',
            type: 'image',
            removalDelay: 300,
            titleSrc: 'title',
            preloader: true,
            showCloseBtn:false,
            fixedBgPos:false,
            fixedContentPos:false,
            gallery:{
                enabled:true
            },
            zoom: {
                enabled: true, // By default it's false, so don't forget to enable it
                duration: 300, // duration of the effect, in milliseconds
                easing: 'ease-in-out', // CSS transition easing function
            }
        });
    });
</script>
</body>
</html>
