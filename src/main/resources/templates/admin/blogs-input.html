<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博文发布</title>
  <link href="../../static/images/twelve.jpg" th:href="@{/images/twelve.jpg}" rel="icon" type="image/x-ico">
  <link rel="stylesheet" href="../../static/css/friend-links.css" th:href="@{/css/friend-links.css}">
  <link rel="stylesheet" href="../../static/css/animate.css" th:href="@{/css/animate.css}">
  <link rel="stylesheet" href="../../static/css/public.css" th:href="@{/css/public.css}">
  <link rel="stylesheet" href="../../static/css/footer.css" th:href="@{/css/footer.css}">
  <link rel="stylesheet" href="../../static/css/header.css" th:href="@{/css/header.css}">
  <link rel="stylesheet" href="../../static/lib/semantic/semantic.min.css" th:href="@{/lib/semantic/semantic.min.css}">

  <link rel="stylesheet" href="../../static/lib/editormd/css/editormd.css" th:href="@{/lib/editormd/css/editormd.css}">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.2/dist/jquery.min.js"></script>
  <script src="../../static/lib/semantic/semantic.min.js" th:src="@{/lib/semantic/semantic.min.js}"></script>

</head>
<body>

<div th:replace="admin/_fragments :: loading-animate" class="loader-wrapper">
  <img src="../../static/images/loading.gif">
</div>

<div class="pusher">
  <!--导航-->
  <div th:replace="admin/_fragments :: header(~{::h1})" id="header">
    <!-- 导航栏 -->
    <nav class="m-shadow-header" id="nav">

      <div class="ui stackable grid">

        <div class="four wide column" align="center" >
          <div class="site-top" id="nav-logo">
            <div class="site-logo">
                    <span class="site-logo-title m-mobile-site-logo-title">
                      <a href="index.html" alt="十二" class="">
                        <span class="sakuraso">十二</span>
                        <span class="no">の</span>
                        <span class="shironeko">世界</span>
                      </a>
                    </span>
            </div>
          </div>
        </div>

        <div class="eight wide column m-mobile-hide" align="center">
          <div id="nav-menu">
            <div class="ui inverted stackable secondary menu">
              <a href="index.html" class="item  wobble"><i class="home icon m-mobile-hide"></i>首页</a>
              <a href="#" class="item  rubberBand"><i class="paper plane icon"></i>博客</a>
              <a href="#" class="item  shake"><i class="tags icon"></i>标签</a>
              <a href="#" class="item pulse"><i class="list alternate outline icon"></i>分类</a>
              <a href="#" class="item  tada"><i class="user plus icon"></i>友链</a>
              <a href="#" class="item  swing"><i class="image icon"></i>图片</a>
            </div>
          </div>
        </div>

        <div class="four wide column m-mobile-hide" align="center">
          <div id="login">
            <a href="admin/login.html" target="_blank" class="swing"><i class="m-white big user circle outline icon"></i></a>
          </div>

        </div>
      </div>

      <a class="ui inverted icon button m-right-top m-mobile-show" id="menu-show">
        <i class="sidebar icon"></i>
      </a>
    </nav>

    <header id="page-header" class="header-image">
      <div id="site-info">
        <h1 id="site-title">博客管理</h1>
        <div id="site-subtitle">
          <span id="subtitle"></span>
          <span class="typed-cursor"></span>
        </div>
      </div>

      <div class="scroll-down-bar">
        <i class="chevron down icon scroll-down-arrow"  style="margin-top: 3rem ;"></i>
      </div>

    </header>
  </div>

  <div id="main" class="ui m-container" style="display: block" >
    <div class="m-padded-tb">
      <div class="ui attached pointing menu">
        <div class="ui container">
          <div class="right menu">
            <a href="blogs-input.html" th:href="@{/admin/blogs/input}" class="teal active item">发布</a>
            <a href="blogs.html" th:href="@{/admin/blogs}" class="item">列表</a>
          </div>
        </div>
      </div>
    </div>

    <!--中间内容-->
    <div  class="">
      <div class="ui container">
        <form id="blog-form" th:object="${blog}" th:action="@{/admin/blogs}" action="#" method="post" class="ui form">
          <input type="hidden" name="publish" th:value="*{publish}">
          <input type="hidden" name="id" th:value="*{id}">

          <div class="required field">
            <div class="ui left labeled input">
              <div class="ui selection compact teal basic dropdown label">
                <input type="hidden" value="原创" name="flag" th:value="*{flag}">
                <i class="dropdown icon"></i>
                <div class="text" >原创</div>
                <div class="menu">
                  <div class="default item" data-value="原创">原创</div>
                  <div class="item" data-value="转载">转载</div>
                  <div class="item" data-value="翻译">翻译</div>
                </div>
              </div>
              <input type="text" name="title" placeholder="标题" th:value="*{title}">
            </div>
          </div>

          <div class="required field">
            <div class="" id="md-content" style="z-index: 1 !important;">
              <textarea placeholder="博客内容" name="content" style="display: none" th:text="*{content}" ></textarea>
            </div>
          </div>

          <div class="two fields">
            <div class="required field">
              <div class="ui left labeled action input">
                <label class="ui compact teal basic label">分类</label>
                <div class="ui fluid selection dropdown">
                  <!--新增-->
                  <input type="hidden" name="type.id" th:value="*{type}!=null ? *{type.id}" >
                  <!--编辑-->
                  <input type="hidden" name="typeId" >
                  <i class="dropdown icon"></i>
                  <div class="default text">分类</div>
                  <div class="menu">
                    <div class="item" data-value="1" th:each="type : ${types}" th:data-value="${type.id}" th:text="${type.typeName}">我的故事</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="field">
              <div class="ui left labeled action input">
                <label class="ui compact teal basic label">标签</label>
                <div class="ui fluid selection multiple search dropdown">
                  <input type="hidden" name="tagIds" th:value="*{tagIds}">
                  <i class="dropdown icon"></i>
                  <div class="default text">标签</div>
                  <div class="menu">
                    <div class="item" data-value="1" th:each="tag : ${tags}" th:data-value="${tag.id}" th:text="${tag.tagName}">java</div>
                  </div>
                </div>
              </div>
            </div>


          </div>

          <div class="required field">
            <div class="ui left labeled input">
              <label class="ui teal basic label">首图</label>
              <input type="text" name="blogPic" placeholder="首图引用地址" th:value="*{blogPic}">
            </div>
          </div>

          <div class="required field">
            <textarea name="description" th:text="*{description}" placeholder="博客描述..." maxlength="200"></textarea>
          </div>

          <div class="inline fields">
            <div class="field">
              <div class="ui checkbox">
                <input type="checkbox" id="Recommend" th:checked="*{Recommend}" name="Recommend" checked class="hidden">
                <label for="Recommend">推荐</label>
              </div>
            </div>
            <div class="field">
              <div class="ui checkbox">
                <input type="checkbox" id="shareStatement" th:checked="*{shareStatement}" name="shareStatement" class="hidden">
                <label for="shareStatement">转载声明</label>
              </div>
            </div>
<!--            <div class="field">-->
<!--              <div class="ui checkbox">-->
<!--                <input type="checkbox" id="appreciation" name="appreciation" class="hidden">-->
<!--                <label for="appreciation">赞赏</label>-->
<!--              </div>-->
<!--            </div>-->
            <div class="field">
              <div class="ui checkbox">
                <input type="checkbox" id="commentAble" th:checked="*{commentAble}" name="commentAble" class="hidden">
                <label for="commentAble">评论</label>
              </div>
            </div>
          </div>

          <div class="ui error message"></div>

          <div class="ui right aligned container">
            <button type="button" class="ui button" onclick="window.history.go(-1)" >返回</button>
            <button type="button" id="save-btn" class="ui secondary button">保存</button>
            <button type="button" id="publish-btn" class="ui teal button">发布</button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <br>
  <br>

  <!--底部栏-->
  <footer th:replace="admin/_fragments :: footer">
    <div id="footer">
      <div class="banner">
        <div class="view">
          <img
                  src="../../static/images/bilibili-tree/bilibili-winter-view-1.43e982a.jpg"
                  class="morning"
          />
          <img
                  src="../../static/images/bilibili-tree/bilibili-winter-view-2.6a60e5a.jpg"
                  class="afternoon"
          />
          <img
                  src="../../static/images/bilibili-tree/snow.png"
                  class="ball"
          />
          <video autoplay loop muted class="evening">
            <source
                    src="../../static/images/bilibili-tree/bilibili-winter-view-3.79f65a9.webm"
                    type="video/webm"
            />
          </video>
          <img
                  src="../../static/images/bilibili-tree/bilibili-winter-view-3-snow.99d5ddb.png"
                  class="window-cover"
          />
        </div>
        <div class="tree">
          <img
                  src="../../static/images/bilibili-tree/bilibili-winter-tree-1.27fde75.png"
                  class="morning"
          />
          <img
                  src="../../static/images/bilibili-tree/bilibili-winter-tree-2.2d1e15b.png"
                  class="afternoon"
          />
          <img
                  src="../../static/images/bilibili-tree/bilibili-winter-tree-3.27ed304.png"
                  class="evening"
          />
        </div>
      </div>
    </div>
  </footer>

  <div th:replace="admin/_fragments :: backTop" class="back-to-top overelement" onclick="backTop()" id="backTop"></div>

</div>

<!--/*/<th:block th:replace="admin/_fragments :: page-script">/*/-->
<!-- loading gif -->
<script type="text/javascript">
  $(window).on('load',function(){
    $('.loader-wrapper').fadeOut("normal")
  });
</script>
<!-- 页尾效果 -->
<script src="../../static/js/footer.js" ></script>
<script src="../../static/js/snow.js" ></script>
<!-- 下拉栏 -->
<script type="text/javascript">
  $(".ui.dropdown").dropdown();
</script>
<!-- 移动端的菜单显示 -->
<script>
  $('#menu-show').click(function(){
    $('.ui.sidebar')
            .sidebar('setting', 'transition', 'overlay')
            .sidebar('toggle');
  })
</script>
<!-- 点击出现文字效果 -->
<script src="../../static/js/font.js" ></script>
<!-- scroll-down-bar的js实现 -->
<script src="../../static/js/Scroll.js" ></script>
<!-- live2d模型 -->
<script src="../../static/live2dw/lib/L2Dwidget.min.js" ></script>
<script>
  L2Dwidget.init({
    "model":{jsonPath:"../static/live2dw/assets/asuna_04.model.json"},
    "display":{"position":"right","width":140,"height":240},
    "mobile":{"show":false},
    "log":false,
    "pluginJsPath":"../static/live2dw/lib/",
    "pluginModelPath":"../static/live2dw/assets/",
    "pluginRootPath":"../static/live2dw/",
    "tagMode":false
  })
</script>
<!-- 进入网页的特效 -->
<script>
  $('#nav')
          .transition({
            animation  : 'fade in',
            duration   : '1.75s',
          });
  $('.scroll-down-bar')
          .transition({
            animation  : 'fade down in',
            duration   : '1.25s',
          });

  $('#site-info')
          .transition({
            animation: 'fade in',
            duration : '1.75s'
          })
</script>
<!-- 滚动条下滑的导航栏出现隐藏 -->
<script src="../../static/js/head.js" ></script>
<script>
  (function () {
    var header = document.querySelector("#nav");

    var headroom = new Headroom(header, {
      offset: 60,
      tolerance: 0,
      classes: {
        initial: "headroom",
        pinned: "headroom--pinned",
        unpinned: "headroom--unpinned",
        top:"headroom--top"

      }
    });
    headroom.init();

  })();
</script>
<!-- 打字机效果 -->
<script src="../../static/lib/typed/typed.js"></script>
<!--/*/</th:block>/*/-->

  <script src="../../static/lib/editormd/editormd.min.js" th:src="@{/lib/editormd/editormd.min.js}"></script>
   <script >
    //初始化Markdown编辑器
    var contentEditor;
    $(function() {
      contentEditor = editormd("md-content", {
        width   : "100%",
        height  : 640,
        syncScrolling : "single",
       // path    : "../../static/lib/editormd/lib/"
        path    : "[[@{/lib/editormd/lib/}]]"
      });
    });

    $('.menu.toggle').click(function () {
      $('.m-item').toggleClass('m-mobile-hide');
    });

    $('.ui.dropdown').dropdown({
      on : 'hover'
    });

    $('#save-btn').click(function () {
      $('[name="publish"]').val(false);
      $('#blog-form').submit();
    });


    $('#publish-btn').click(function () {
      $('[name="publish"]').val(true);
      $('#blog-form').submit();
    });



    $('.ui.form').form({
      fields : {
        title : {
          identifier: 'title',
          rules: [{
            type : 'empty',
            prompt: '标题：请输入博客标题'
          }]
        },
        content : {
          identifier: 'content',
          rules: [{
            type : 'empty',
            prompt: '标题：请输入博客内容'
          }]
        },
        typeId : {
          identifier: 'type.id',
          rules: [{
            type : 'empty',
            prompt: '标题：请输入博客分类'
          }]
        },
        // tagIds : {
        //   identifier: 'tagIds',
        //   rules: [{
        //     type : 'empty',
        //     prompt: '标题：请输入博客标签'
        //   }]
        // },

        firstPicture : {
          identifier: 'blogPic',
          rules: [{
            type : 'empty',
            prompt: '标题：请输入博客首图'
          }]
        },
        description : {
          identifier: 'description',
          rules: [{
            type : 'empty',
            prompt: '标题：请输入博客描述'
          }]
        }
      }
    });

  </script>
</body>
</html>
