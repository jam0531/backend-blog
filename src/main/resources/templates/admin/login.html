<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="博客的管理登录界面">
    <meta name="keyword" content="十二,博客登录管理, 登录">
    <meta name="author" content="十二, Alex">
    <title>十二</title>
    <link href="../../static/images/twelve.jpg" th:href="@{/images/twelve.jpg}" rel="icon" type="image/x-ico">
    <link rel="stylesheet" href="../../static/lib/semantic/semantic.css" th:href="@{/lib/semantic/semantic.css}">
    <link rel="stylesheet" href="../../static/css/animate.css" th:href="@{/css/animate.css}">
    <link rel="stylesheet" href="../../static/css/login.css" th:href="@{/css/login.css}">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.2/dist/jquery.min.js"></script>
    <script src="../../static/lib/semantic/semantic.min.js" th:src="@{/lib/semantic/semantic.min.js}"></script>
    
  </head>
  <body>
    <div id="main">
      <div class="login ui middle aligned center aligned grid">
        <form class="ui large form" method="post" action="#" th:action="@{/admin/login}">
          <div class="ui content" align='center'>
            TO ADMIN
          </div>
          <div class="ui  segment">
            <div class="field">
              <div class="ui left icon input">
                <i class="user icon"></i>
                <input type="text" name="username" placeholder="用户名" autocomplete="nope">
              </div>
            </div>
            <div class="field">
              <div class="ui left icon input">
                <i class="lock icon"></i>
                <input type="password" name="password" placeholder="密码" autocomplete="nope">
              </div>
            </div>
            <button class="ui fluid large teal submit button">登   录</button>
          </div>

          <div class="ui error mini message"></div>
          <div class="ui mimi negative message" th:unless="${#strings.isEmpty(message)}" th:text="${message}">用户名密码错误</div>

        </form>
      </div>
    </div>

    <script>
      $('.ui.form').form({
        fields : {
          username : {
            identifier: 'username',
            rules: [{
              type : 'empty',
              prompt: '请输入用户名'
            }]
          },
          password : {
            identifier: 'password',
            rules: [{
              type : 'empty',
              prompt: '请输入密码'
            }]
          }
        }
      });
    </script>
  </body>

</html>
